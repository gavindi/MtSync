name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and release (e.g. 0.9.99)"
        required: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify CMakeLists.txt and snapcraft.yaml match the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          CMAKE_VERSION=$(grep -oP '(?<=VERSION )\d+\.\d+\.\d+' CMakeLists.txt | head -1)
          SNAP_VERSION=$(grep -oP "(?<=version: ')[^']+" snap/snapcraft.yaml | head -1)
          FAILED=0
          if [[ "$CMAKE_VERSION" != "$TAG" ]]; then
            echo "::error::CMakeLists.txt PROJECT_VERSION ($CMAKE_VERSION) does not match release tag ($TAG)"
            FAILED=1
          fi
          if [[ "$SNAP_VERSION" != "$TAG" ]]; then
            echo "::error::snap/snapcraft.yaml version ($SNAP_VERSION) does not match release tag ($TAG)"
            FAILED=1
          fi
          exit "$FAILED"

  deb:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['24.04', '25.10', '26.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake g++ pkg-config \
            libgtkmm-4.0-dev \
            libadwaita-1-dev \
            libsoup-3.0-dev \
            libcairo2-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
          UBUNTU: ${{ matrix.ubuntu }}
        run: |
          cd build && cpack -G DEB
          mv *.deb "mtsync_${TAG}_ubuntu${UBUNTU}_$(uname -m).deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-${{ matrix.ubuntu }}
          path: build/*.deb

  rpm:
    needs: check-version
    runs-on: ubuntu-24.04
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ pkg-config \
            gtkmm4.0-devel \
            libadwaita-devel \
            libsoup3-devel \
            cairo-devel \
            nlohmann-json-devel \
            rpm-build

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd build && cpack -G RPM
          mv *.rpm "mtsync_${TAG}_$(. /etc/os-release && echo ${ID}${VERSION_ID})_$(uname -m).rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/*.rpm

  appimage:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config \
            libgtkmm-4.0-dev \
            libadwaita-1-dev \
            libsoup-3.0-dev \
            libcairo2-dev \
            nlohmann-json3-dev \
            libfuse2

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel $(nproc)

      - name: Install to AppDir
        run: DESTDIR=$(pwd)/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh

      - name: Create AppImage
        env:
          DEPLOY_GTK_VERSION: 4
          VERSION: ${{ inputs.tag }}
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --plugin gtk \
            --output appimage
          mv *.AppImage mtsync_${VERSION}_$(uname -m).AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "*.AppImage"

  flatpak:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform/x86_64/48 org.gnome.Sdk/x86_64/48

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mtsync_${{ inputs.tag }}_x86_64.flatpak
          manifest-path: packaging/com.mtsync.MtSync.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: mtsync_${{ inputs.tag }}_x86_64.flatpak

  snap:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: snapcore/action-build@v1

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: "*.snap"

  release:
    needs: [deb, rpm, appimage, flatpak, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          awk -v ver="$TAG" '
            $0 ~ "^## " ver " " { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: MtSync ${{ inputs.tag }}
          body_path: release-notes.md
          files: dist/**/*
